name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/GoodMorningCore

  app-build:
    # Compile check only (no signing). TestFlight upload is a separate workflow, added once
    # the Apple Developer account and App Store Connect API key exist.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild build
          -project GoodMorning.xcodeproj
          -scheme GoodMorning
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
